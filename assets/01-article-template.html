<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<style>
  :root {
    color-scheme: light;
    --canvas: #f7f7f5;
    --paper: #ffffff;
    --ink: #202124;
    --muted: #5f6368;
    --line: #dadce0;
    --accent: #2b5f73;
    --tint: #e9f2f5;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.75;
  }
  main {
    width: min(760px, calc(100% - 32px));
    margin: 24px auto;
    padding: 48px 56px;
    background: var(--paper);
  }
  h1 { margin: 0 0 32px; font-size: 32px; line-height: 1.3; font-weight: 600; }
  h2 { margin: 40px 0 16px; font-size: 24px; line-height: 1.35; font-weight: 600; }
  h3 { margin: 28px 0 12px; font-size: 20px; line-height: 1.4; font-weight: 600; }
  #copy-area img { display: block; width: 100%; height: auto; }
  {{EXTRA_CSS}}
  @media (max-width: 768px) {
    main { width: 100%; margin: 0; padding: 32px 16px; }
  }
  @media print {
    body { background: #ffffff; }
    main { width: auto; margin: 0; padding: 0; }
  }
</style>
</head>
<body>
<main data-artifact="document">
  <h1>{{TITLE}}</h1>
  <div id="copy-area">
{{BODY}}
  </div>
</main>
{{EXTRA_HTML}}
</body>
</html>
